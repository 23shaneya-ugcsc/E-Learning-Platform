<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Dashboard - CODE FEST</title>
  <style>
body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f8f9fa;
    }

    /* Header */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 10px 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .site-header .logo {
      height: 50px;
      width: auto;
    }

    .site-header h1 {
      font-size: 28px;
      font-weight: bold;
      color: #1e3c72;
      letter-spacing: 1px;
      flex: 1;
      text-align: center;
    }

    .logout-btn {
      background: #ff4757;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .logout-btn:hover {
      background: #e84118;
    }

    /* Top Navigation */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e3c72;
      color: white;
      padding: 10px 20px;
    }

    .top-nav h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
    }

    .search-bar input {
      padding: 6px 12px;
      border-radius: 5px;
      border: none;
      outline: none;
    }

    /* Marquee section */
    .announcement {
      background: #2a5298;
      color: white;
      padding: 8px;
      font-size: 0.95em;
    }

    /* Course Grid */
    .course-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .course-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 15px;
      transition: transform 0.2s;
    }

    .course-card:hover {
      transform: translateY(-5px);
    }

    .course-card img {
      width: 100%;
      border-radius: 10px;
      height: 150px;
      object-fit: cover;
    }

    .course-card h3 {
      margin: 10px 0 5px;
      color: #1e3c72;
    }

    .course-card p {
      font-size: 0.9em;
      color: #555;
      margin: 5px 0;
    }

    .info {
      background: #f1f3f6;
      border-radius: 8px;
      padding: 8px;
      font-size: 0.85em;
      margin-top: 8px;
    }

    .enroll-btn {
      background: #1e3c72;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .enroll-btn:hover {
      background: #3a5ba0;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <img src="D:/logo.png" alt="CODE FEST Logo" class="logo" />
    <h1>CODE FEST</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <div class="announcement">
    <marquee behavior="scroll" direction="left">
      🎉 New AI & Web Development courses added! | 🏅 Complete courses and earn CODE FEST certification! | 🚀 Learn from industry experts today!
    </marquee>
  </div>


  <div class="course-list" id="courseList"></div>


  <script>
    // ✅ Added logout function
    function logout() {
      localStorage.clear();
      window.location.href = "login.html";
    }

    // Fetch courses from backend
    async function loadCourses() {
      try {
        const response = await fetch("http://localhost:5000/api/courses");
        const courses = await response.json();
        const courseList = document.getElementById("courseList");

        courses.forEach(course => {
          const card = document.createElement("div");
          card.className = "course-card";

          // ✅ Added image, duration, topics
          card.innerHTML = `
            <img src="http://localhost:5000${course.image}" alt="${course.title}">
            <h3>${course.title}</h3>
            <p>${course.description || "No description provided."}</p>
            <p><strong>Duration:</strong> ${course.duration || "Not specified"}</p>
            <p><strong>Topics Covered:</strong> ${(course.topics && course.topics.length > 0) ? course.topics.join(", ") : "Not listed"}</p>
          `;

          const btn = document.createElement("button");
          btn.className = "enroll-btn";
          btn.textContent = "Enroll Now";

          // Redirect to enroll page with courseId
          btn.onclick = () => {
            localStorage.setItem("selectedCourseId", course._id);
            window.location.href = `enroll.html?courseId=${encodeURIComponent(course._id)}`;
          };

          card.appendChild(btn);
          courseList.appendChild(card);
        });
      } catch (err) {
        console.error("Error loading courses:", err);
      }
    }
    function searchCourses() {
      const searchValue = document.getElementById("searchInput").value.toLowerCase();
      const cards = document.querySelectorAll(".course-card");
      cards.forEach(card => {
        const title = card.querySelector("h3").textContent.toLowerCase();
        card.style.display = title.includes(searchValue) ? "block" : "none";
      });
    }
    

    loadCourses();
  </script>
</body>
</html>
