<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - CODE FEST</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
  }
  .container {
    background: rgba(255,255,255,0.1);
    padding: 40px;
    border-radius: 12px;
    text-align: center;
    width: 380px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  h1 { margin-bottom: 15px; color: orange; }
  p { font-size: 14px; margin-bottom: 20px; }
  input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 6px;
    outline: none;
  }
  button {
    background: orange;
    color: black;
    font-weight: bold;
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
  }
  button:hover { background: #ffb84d; }
  .links { margin-top: 20px; font-size: 14px; }
  .links a { color: #ffd966; cursor: pointer; text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  #msg { margin-top: 15px; font-size: 14px; }
</style>
</head>
<body>
  <div class="container">
    <h1>Forgot Password</h1>
    <p>Reset your password using a security question.</p>

    <!-- Step 1: Username -->
    <div id="step1">
      <input type="text" id="fpUsername" placeholder="Enter your username" required>
      <button onclick="askSecurityQuestion()">Next</button>
    </div>

    <!-- Step 2: Security Question -->
    <div id="step2" style="display:none;">
      <p id="securityQ"></p>
      <input type="text" id="answer" placeholder="Your Answer" required>
      <button onclick="checkAnswer()">Submit Answer</button>
    </div>

    <!-- Step 3: Reset Password -->
    <div id="step3" style="display:none;">
      <input type="password" id="newPassword" placeholder="Enter New Password" required>
      <button onclick="resetPassword()">Reset Password</button>
    </div>

    <div class="links">
      <a href="login.html">Back to Login</a> | 
      <a href="courses.html">Back to Courses</a>
    </div>
    <div id="msg"></div>
  </div>

  <script>
    // Dummy security questions (you can expand this)
    const securityData = {
      Shaneya: { question: "What is your favorite color?", answer: "blue" },
      navya: { question: "What is your pet’s name?", answer: "rocky" },
      kavya: { question: "What is your birth city?", answer: "chennai" }
    };

    let currentUser = null;

    function askSecurityQuestion() {
      const user = document.getElementById("fpUsername").value.trim();
      if (securityData[user]) {
        currentUser = user;
        document.getElementById("securityQ").innerText = securityData[user].question;
        document.getElementById("step1").style.display = "none";
        document.getElementById("step2").style.display = "block";
        document.getElementById("msg").innerText = "";
      } else {
        document.getElementById("msg").innerText = "Username not found or no security question set.";
        document.getElementById("msg").style.color = "red";
      }
    }

    function checkAnswer() {
      const ans = document.getElementById("answer").value.trim().toLowerCase();
      if (ans === securityData[currentUser].answer.toLowerCase()) {
        document.getElementById("step2").style.display = "none";
        document.getElementById("step3").style.display = "block";
        document.getElementById("msg").innerText = "Correct! Now reset your password.";
        document.getElementById("msg").style.color = "yellow";
      } else {
        document.getElementById("msg").innerText = "Incorrect answer. Try again.";
        document.getElementById("msg").style.color = "red";
      }
    }

    function resetPassword() {
      const newPass = document.getElementById("newPassword").value.trim();
      if (newPass.length < 4) {
        document.getElementById("msg").innerText = "Password must be at least 4 characters.";
        document.getElementById("msg").style.color = "red";
        return;
      }
      // Store in localStorage (demo only)
      localStorage.setItem(currentUser + "_password", newPass);

      document.getElementById("msg").innerText = "Password reset successfully (demo only).";
      document.getElementById("msg").style.color = "lightgreen";
      document.getElementById("step3").style.display = "none";
    }
  </script>
</body>
</html>
