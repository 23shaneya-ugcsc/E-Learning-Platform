<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background:#f0f2f5; display:flex; align-items:center; justify-content:center; height:100vh; }
    .login-box { background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); width:300px; }
    h2 { color:#1e3c72; text-align:center; }
    input { width:100%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:5px; }
    button { width:100%; padding:10px; background:#1e3c72; color:white; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#162850; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <form onsubmit="login(event)">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    function login(e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if(username === "admin" && password === "1234"){ 
        localStorage.setItem("adminToken","true");
        window.location.href = "admin-dashboard.html"; // redirect to dashboard
      } else {
        alert("Invalid credentials!");
      }
    }
  </script>
</body>
</html>
